<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" fill="none" role="img" aria-label="Varta AI">
  <defs>
    <linearGradient id="vartaBubbleGrad" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#34E47A"/>
      <stop offset="55%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="vartaBubbleShine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="vartaBubbleShadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a3d2c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon: sized to pair with ~28px wordmark cap height -->
  <g filter="url(#vartaBubbleShadow)">
    <path
      fill="url(#vartaBubbleGrad)"
      d="M7 9h34a6 6 0 0 1 6 6v17a6 6 0 0 1-6 6H19l-6 6v-6H7a6 6 0 0 1-6-6V15a6 6 0 0 1 6-6Z"
    />
    <path
      fill="url(#vartaBubbleShine)"
      d="M7 9h34a6 6 0 0 1 6 6v17a6 6 0 0 1-6 6H19l-6 6v-6H7a6 6 0 0 1-6-6V15a6 6 0 0 1 6-6Z"
    />
  </g>

  <!-- Network motif -->
  <circle cx="18" cy="23" r="2.65" fill="#fff" fill-opacity="0.96"/>
  <circle cx="30.5" cy="31" r="2.65" fill="#fff" fill-opacity="0.96"/>
  <circle cx="38.5" cy="20" r="2.65" fill="#fff" fill-opacity="0.96"/>
  <path
    d="M18 23 30.5 31M30.5 31 38.5 20"
    stroke="#fff"
    stroke-opacity="0.92"
    stroke-width="1.65"
    stroke-linecap="round"
  />

  <!-- Wordmark: larger for balance with icon -->
  <text
    x="56"
    y="38"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.035em"
    xml:space="preserve"
  >
    <tspan fill="#0B141A">Varta</tspan><tspan fill="#25D366" font-weight="800" letter-spacing="-0.02em"> AI</tspan>
  </text>
</svg>
